name: CI/CD Pipeline to Hostinger KVM

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Convertir nombre de repositorio a minúsculas
      id: string
      run: |
        echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Iniciar sesión en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Construir y publicar imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ steps.string.outputs.IMAGE_NAME }}:latest

    - name: Desplegar en KVM mediante SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          mkdir -p /opt/cloudpulse
          cat << 'EOF' > /opt/cloudpulse/docker-compose.yml
          version: '3.8'
          services:
            app:
              image: ghcr.io/${{ steps.string.outputs.IMAGE_NAME }}:latest
              container_name: cloudpulse_app
              restart: always
              ports:
                - "3000:3000"
          EOF
          cd /opt/cloudpulse
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f